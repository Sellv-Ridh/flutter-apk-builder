name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL file ZIP project Flutter (wajib diisi)"
        required: true
        default: ""
      flutter_version:
        description: "Versi Flutter (kosongkan = stable terbaru)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      # 1. Download ZIP
      - name: Download ZIP
        run: |
          set -e
          curl -L --fail --retry 3 -o project.zip "${{ inputs.zip_url }}"
          ls -lh project.zip

      # 2. Extract ZIP
      - name: Extract ZIP
        run: |
          set -e
          rm -rf extract project
          mkdir extract
          unzip -q Root-upgraded.zip -d extract

          # Cari pubspec.yaml terdekat dari root (zip bisa berisi subfolder)
          PUBSPEC=$(find extract -name pubspec.yaml \
            -not -path "*/.*" -not -path "*/ios/*" -not -path "*/macos/*" \
            | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP"
            find extract -maxdepth 3
            exit 1
          fi

          mv "$(dirname "$PUBSPEC")" project

          # Buang file lokal bawaan developer yang bentrok dengan CI
          rm -f project/android/local.properties
          rm -f project/.flutter-plugins-dependencies

          echo "=== Isi project ==="
          ls -la project

      # 3. Toolchain
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Versi Flutter
        run: flutter --version

      # 4. Dependencies (retry tanpa lock file jika gagal)
      - name: Pub get
        working-directory: project
        run: |
          if ! flutter pub get; then
            echo "::warning::pub get gagal dengan pubspec.lock, mencoba ulang tanpa lock"
            rm -f pubspec.lock
            flutter pub get
          fi

      # 5. Build
      - name: Build APK
        working-directory: project
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 2>&1 | tee build.log

      # 6. Hasil
      - name: Daftar APK
        if: always()
        run: find project -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: project/build.log
          if-no-files-found: ignore
          retention-days: 3
